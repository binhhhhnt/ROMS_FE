<!DOCTYPE html>
<html lang="en" style="width: 1280px; height: 789px; overflow: hidden; position: relative;">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_blank" name="shell-type">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
  <style>
    @layer base {

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        overscroll-behavior: none;
      }

      main>:first-child {
        margin-top: 0 !important;
      }

      main>:last-child {
        margin-bottom: 0 !important;
      }
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script
    id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-dim": "#eed4d2", "outline-variant": "#e1bebb", "outline": "#8d706d", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "on-surface-variant": "#59413e", "surface-container-high": "#fde2df", "error": "#ba1a1a", "on-tertiary-fixed-variant": "#004d61", "on-background": "#261817", "secondary-container": "#ffd6ab", "tertiary-fixed-dim": "#85d1ee", "on-primary": "#ffffff", "primary-fixed-dim": "#ffb3ad", "on-error": "#ffffff", "tertiary": "#004f64", "surface-container-low": "#fff0ef", "on-tertiary-fixed": "#001f29", "surface-container": "#ffe9e7", "on-primary-container": "#ffd1cc", "secondary-fixed-dim": "#e8bf95", "primary-fixed": "#ffdad6", "surface-tint": "#b22929", "on-primary-fixed": "#410003", "inverse-primary": "#ffb3ad", "background": "#fff8f7", "on-secondary-fixed": "#2b1700", "surface-container-highest": "#f7ddda", "secondary-fixed": "#ffddba", "on-secondary": "#ffffff", "on-secondary-container": "#7a5b38", "inverse-surface": "#3c2d2b", "surface": "#fff8f7", "primary": "#930e16", "tertiary-container": "#006983", "on-secondary-fixed-variant": "#5d4121", "inverse-on-surface": "#ffedeb", "on-primary-fixed-variant": "#900c15", "on-surface": "#261817", "tertiary-fixed": "#b9eaff", "surface-bright": "#fff8f7", "on-error-container": "#93000a", "surface-variant": "#f7ddda", "on-tertiary-container": "#a5e5ff", "primary-container": "#b52b2b", "on-tertiary": "#ffffff", "secondary": "#775836" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "2rem", "space-md": "1rem", "space-sm": "0.5rem", "margin": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-lg": "1.5rem" }, "fontFamily": { "body-md": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"], "headline-xl": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-xl": ["32px", { "lineHeight": "40px", "fontWeight": "700" }] } } } }</script>
</head>

<body
  class="bg-background font-body-md text-body-md text-on-background min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed">
  <header class="w-full py-space-lg px-margin flex items-center justify-between">
    <div class="flex items-center gap-space-sm">
      <div class="w-8 h-8 bg-primary flex items-center justify-center"><span
          class="material-symbols-outlined text-on-primary text-[20px]">restaurant</span></div>
      <div class="flex flex-col"><span
          class="font-headline-sm text-headline-sm tracking-tight text-on-surface">ROMS</span></div>
    </div>
    <div class="flex items-center gap-space-xs font-label-sm text-label-sm text-on-surface-variant"></div>
  </header>
  <main class="flex-1 flex items-center justify-center w-full px-margin py-space-xl">
    <div class="flex flex-col w-full items-center justify-center">
      <div class="w-full max-w-[460px] mx-auto">
        <div class="bg-surface-container-lowest border border-outline-variant shadow-xl p-space-xl transition-all">
          <!-- Brand & Header -->
          <div class="flex flex-col items-center text-center">
            <div class="w-14 h-14 bg-primary-container flex items-center justify-center mb-space-md">
              <span class="material-symbols-outlined text-on-primary text-[32px]">restaurant</span>
            </div>
            <div class="flex items-center gap-space-xs mb-space-xs">
              <span
                class="font-headline-lg text-headline-lg tracking-tight text-on-surface uppercase font-bold">ROMS</span>


            </div>
            <h1 class="font-headline-sm text-headline-sm text-on-surface">
              Hệ thống Quản lý vận hành nhà hàng</h1>

            <div
              class="mt-space-md inline-flex items-center gap-1.5 px-3 py-1 bg-surface-container-low border border-outline-variant">
              <span class="w-1.5 h-1.5 bg-primary"></span>
              <span class="font-label-sm text-label-sm text-on-surface-variant tracking-wide uppercase">
                Dành cho Quản trị viên &amp; Nhân viên
              </span>
            </div>
          </div>
          <!-- Divider line -->
          <div class="w-full h-px bg-outline-variant my-space-lg"></div>
          <!-- Login Form -->
          <form class="flex flex-col gap-space-md" id="roms-login-form">
            <!-- Username / Staff ID -->
            <div class="flex flex-col gap-1.5">
              <label class="font-label-md text-label-md text-on-surface flex items-center justify-between"
                for="username">
                <span class="">Tên đăng nhập / Email</span>
                <span class="font-label-sm text-label-sm text-on-surface-variant">Bắt buộc</span>
              </label>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">
                  badge
                </span>
                <input autocomplete="username"
                  class="w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:bg-surface-container-low transition-colors"
                  id="username" name="username" placeholder="Nhập tên đăng nhập hoặc email" required="" type="text">
              </div>
            </div>
            <!-- Password -->
            <div class="flex flex-col gap-1.5">
              <div class="flex items-center justify-between">
                <label class="font-label-md text-label-md text-on-surface" for="password">
                  Mật khẩu
                </label>
                <a class="font-label-sm text-label-sm text-primary hover:underline">
                  Quên mật khẩu?</a>
              </div>
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">
                  lock
                </span>
                <input autocomplete="current-password"
                  class="w-full pl-10 pr-10 py-2.5 bg-surface-container-lowest border border-outline-variant font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:bg-surface-container-low transition-colors"
                  id="password" name="password" placeholder="••••••••" required="" type="password">
                <button aria-label="Ẩn hoặc hiện mật khẩu"
                  class="absolute right-2 p-1.5 text-on-surface-variant hover:text-on-surface focus:outline-none"
                  id="toggle-password" title="Ẩn/Hiện mật khẩu" type="button">
                  <span class="material-symbols-outlined text-[20px]" id="password-icon">
                    visibility
                  </span>
                </button>
              </div>
            </div>

            <!-- Notice Alert (Hidden by default, shown on support notice click) -->

            <!-- Submit Button -->
            <button
              class="w-full mt-space-xs py-3 px-space-md bg-primary-container text-on-primary font-headline-sm text-headline-sm uppercase tracking-wide flex items-center justify-center gap-2 hover:bg-primary active:translate-y-px transition-all"
              id="btn-submit" type="submit">
              <span class="material-symbols-outlined text-[20px]">login</span>
              <span id="btn-text" class="">Đăng nhập</span>
            </button>
          </form>
          <!-- Access Policy Notice -->
          <div
            class="mt-space-lg pt-space-md border-t border-outline-variant flex items-start gap-2 text-on-surface-variant">
            <span class="material-symbols-outlined text-outline text-[18px] shrink-0 mt-0.5">verified_user</span>
            <p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
              Tài khoản được cấp bởi Quản trị viên nhà hàng. Vui lòng liên hệ Quản lý nếu bạn chưa có thông tin truy
              cập.
            </p>
          </div>
        </div>
        <!-- Outer Sub-footer -->

      </div>
    </div>
  </main>



</body>

</html>
